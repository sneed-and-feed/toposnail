[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "toposnail"
version = "0.1.0"
description = "toposnail: Beltrami-Triad 3D Anisotropic Topology, Michell Truss & #![no_std] Rust SIMD Optimizer + 3D WebGL .STL Studio"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "CC0-1.0" }
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
]

[project.urls]
Homepage = "https://github.com/sneed-and-feed/toposnail"
Repository = "https://github.com/sneed-and-feed/toposnail"

[tool.setuptools.packages.find]
where = ["."]
include = ["toposnail*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
